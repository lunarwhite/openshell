[package]
name = "openshell-driver-lxd"
description = "LXD compute driver for OpenShell (Phase 1 proof of concept: LXD/LXC on Ubuntu, container instances only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "openshell_driver_lxd"
path = "src/lib.rs"

[[bin]]
name = "openshell-driver-lxd"
path = "src/main.rs"

[dependencies]
openshell-core = { path = "../openshell-core", default-features = false }

tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tonic = { workspace = true, features = ["transport"] }
futures = { workspace = true }
tokio-stream = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
prost-types = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
miette = { workspace = true }
url = { workspace = true }

# OCI-to-LXD image conversion pipeline (Phase 2, Step 1) -- same crates
# and versions `openshell-driver-vm` already uses for the same purpose
# (registry pull, layer decompression, digest verification), not a new
# dependency family for the workspace.
oci-client = "0.16"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
zstd = "0.13"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"

[lints]
workspace = true
